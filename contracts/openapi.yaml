openapi: 3.1.0
info:
  title: Waypoint AI API
  version: 1.0.0
  description: >-
    HTTP status and metadata endpoints. Any endpoint can answer 500 with {"error": "internal_error"}
    and no further detail. Assistant turns are transported through
    the WebSocket protocol documented in websocket.md.
servers:
  - url: http://127.0.0.1:8000
    description: Local development backend
paths:
  /api/v1/healthz:
    get:
      operationId: getHealth
      summary: Check backend liveness
      responses:
        '200':
          description: Backend process is responsive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/assistant/capabilities:
    get:
      operationId: getAssistantCapabilities
      summary: Read safe assistant readiness and supported filters
      responses:
        '200':
          description: Readiness and public capabilities; no secrets or host paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /api/v1/assistant/history:
    delete:
      operationId: clearAssistantHistory
      summary: Clear locally stored assistant conversation history for the demo workspace
      responses:
        '204':
          description: All saved conversations for the local demo workspace were deleted.
        '500':
          description: The conversation store is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, const: internal_error }
  /api/v1/map/route:
    post:
      operationId: buildMapRoute
      summary: Calculate an optimized road route through up to eight verified map points
      description: Coordinates are forwarded by the backend to the configured OSRM-compatible routing service. No prompt text or place names are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Road geometry, route metrics, and point order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePlan'
        '400':
          description: Invalid points or point count.
        '502':
          description: Routing service is unavailable or returned no route.
  /api/v1/data/sources:
    get:
      operationId: listDataSources
      summary: List sources enabled for the current user/workspace
      responses:
        '200':
          description: Enabled source descriptors.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSource'
  /api/v1/data/places:
    get:
      operationId: searchMapPlaces
      summary: Search locally imported named places and explicit address points
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          schema: { type: string, maxLength: 120 }
        - name: city
          in: query
          schema: { type: string, maxLength: 120 }
        - name: sourceIds
          in: query
          description: Comma-separated source IDs; at most 20 are used.
          schema: { type: string, maxLength: 500 }
        - name: bbox
          in: query
          description: minLon,minLat,maxLon,maxLat; geographic coordinates in WGS84.
          schema: { type: string, pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Capped place results, map points, and source provenance.
          content:
            application/json:
              schema:
                type: object
                required: [total, places, mapFeatures, sources]
                properties:
                  total: { type: integer, minimum: 0 }
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
                  mapFeatures:
                    type: object
                    required: [type, features]
                    properties:
                      type: { const: FeatureCollection }
                      features: { type: array, items: { type: object } }
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/DataSource' }
        '400':
          description: Invalid bbox or query.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /api/v1/investigations/events:
    get:
      operationId: searchInvestigationEvents
      summary: Search imported events by time, area, magnitude, and source (demo)
      description: >-
        Read-only search over imported records. Every query is bounded: the time window defaults to the
        last 7 days and may not exceed 90 days, radius searches are limited to 300 km, and pages hold at
        most 200 events. Results are sorted by observedAt descending, then id ascending. Requests are
        rate-limited per client.
      parameters:
        - { name: from, in: query, description: Inclusive start, ISO 8601 with offset. Defaults to 7 days before `to`., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Inclusive end, ISO 8601 with offset. Defaults to now., schema: { type: string, format: date-time } }
        - { name: bbox, in: query, description: 'minLon,minLat,maxLon,maxLat in WGS84. Cannot be combined with lat/lon/radiusKm.', schema: { type: string, maxLength: 100 } }
        - { name: lat, in: query, description: Circle center latitude; requires lon and radiusKm., schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, description: Circle center longitude; requires lat and radiusKm., schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 300 } }
        - { name: minMagnitude, in: query, schema: { type: number, minimum: -3, maximum: 11 } }
        - { name: maxMagnitude, in: query, schema: { type: number, minimum: -3, maximum: 11 } }
        - { name: sourceIds, in: query, description: Comma-separated source IDs; at most 20 are used., schema: { type: string, maxLength: 500 } }
        - { name: category, in: query, description: 'Exact category, for example seismic:earthquake.', schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: Opaque value from a previous nextCursor., schema: { type: string, maxLength: 300 } }
        - { name: merge, in: query, description: 'true lists an earthquake reported by several catalogues once, preferring INGV over USGS; the other copy is in crossCheck.', schema: { type: string, enum: ['true', 'false'] } }
        - { name: crossCheck, in: query, description: 'Only events another catalogue confirms (confirmed) or describes differently (conflict).', schema: { type: string, enum: [confirmed, conflict] } }
      responses:
        '200':
          description: One page of events with the applied filters and source provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSearchResponse' }
        '400':
          description: >-
            Invalid, conflicting, or unbounded parameters: invalid_query (malformed or unknown parameter),
            invalid_time_window, invalid_radius_query (lat, lon, and radiusKm must be given together),
            invalid_area_filter (bbox combined with a radius), invalid_bbox,
            invalid_magnitude_range (minMagnitude greater than maxMagnitude), or invalid_cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                window: { value: { error: invalid_time_window } }
                area: { value: { error: invalid_area_filter } }
                magnitude: { value: { error: invalid_magnitude_range } }
        '429':
          description: Too many requests from this client; see Retry-After.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/investigations/events/{id}:
    get:
      operationId: getInvestigationEvent
      summary: Read one event with nearby verified places, sources, and the last sync run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 120, pattern: '^[\w.:-]+$' } }
      responses:
        '200':
          description: Event details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetailsResponse' }
        '400': { description: Invalid ID., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Event not found., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/entities/{id}:
    get:
      operationId: getInvestigationEntity
      summary: Read one place with the events linked to it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 120, pattern: '^[\w.:-]+$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Place details and linked events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetailsResponse' }
        '400': { description: Invalid ID or limit., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Place not found., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/import/{sourceId}:
    post:
      operationId: startInvestigationImport
      summary: Start a bounded import from an allowlisted event source (demo, disabled by default)
      description: >-
        Available only when INVESTIGATION_IMPORT_ENABLED=true. The demo has no authentication, so the
        trigger is off by default; use `npm run data:import:events` instead. One import per source runs
        at a time, and a cooldown applies between imports.
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: string, enum: [ingv-fdsn, usgs-fdsn, demo-seismic-synthetic] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                days: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '202':
          description: Import started; poll GET /api/v1/data/sources for lastSync.
          content:
            application/json:
              schema:
                type: object
                required: [runId, sourceId, status]
                properties:
                  runId: { type: string, format: uuid }
                  sourceId: { type: string }
                  status: { const: running }
        '400': { description: Invalid request body or malformed JSON (invalid_json)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '415': { description: The body is not application/json; this also blocks cross-site form posts., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: The import trigger is disabled., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Unknown source., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: An import for this source is already running., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429':
          description: Cooldown or rate limit; see Retry-After.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      retryAfterSeconds: { type: integer, minimum: 1 }
  /api/v1/investigations/imports:
    get:
      operationId: listImportJobs
      summary: Import jobs of a workspace, newest first (demo)
      description: Lets the import dock reattach to running jobs after a page reload. Progress also arrives as `import.progress` over the assistant WebSocket.
      parameters:
        - { name: active, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: workspaceId, in: query, required: false, schema: { type: string, pattern: '^[\w.-]{1,120}$', default: demo } }
      responses:
        '200':
          description: Up to `limit` jobs.
          content:
            application/json:
              schema:
                type: object
                required: [importEnabled, jobs, cooldowns]
                properties:
                  importEnabled: { type: boolean, description: Whether POST /imports is enabled (INVESTIGATION_IMPORT_ENABLED). }
                  cooldowns: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: Seconds until each event source may be imported again; 0 when it may run now. }
                  osmAreaMaxSquareDegrees: { type: number, description: Largest area an OSM area import may cover. }
                  jobs: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
        '400': { description: Invalid workspace ID., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    post:
      operationId: startImportJob
      summary: Start an import job (demo, disabled by default)
      description: >-
        Available only when INVESTIGATION_IMPORT_ENABLED=true; the demo has no authentication. A job imports either
        allowlisted event sources over a period (`kind: events`, the default) or OpenStreetMap places of an area from
        the Overpass API (`kind: osm_area`). Sources run one after another in the API process and each records its own
        audit row in source_sync_runs. Event sources keep their cooldown (a source in cooldown fails with
        import_cooldown and retryAfterSeconds). An area is fetched in 0.25-degree tiles with a pause between requests,
        written in one transaction, and stored as its own dataset `osm-area-<name>`; places another dataset already
        holds keep their dataset. Only one area import runs at a time, and at most three jobs per workspace.
        A job of `kind: dataset_delete` deletes a dataset imported from the app (`osm-area-*` or `osm-region-*`; built-in
        datasets are refused with dataset_not_deletable): its places are deleted in batches in one transaction, so a
        cancel rolls it back; events keep their rows with the place reference cleared, and the dataset row stays,
        marked unavailable, for the sync history. No two running jobs may target the same dataset (dataset_busy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [sourceIds]
                  properties:
                    kind: { const: events }
                    sourceIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [ingv-fdsn, usgs-fdsn, demo-seismic-synthetic] } }
                    days: { type: integer, minimum: 1, maximum: 30, default: 7 }
                    workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
                - type: object
                  additionalProperties: false
                  required: [kind, datasetId]
                  description: Deletes an imported dataset; its label comes from the database.
                  properties:
                    kind: { const: dataset_delete }
                    datasetId: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
                    workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
                - type: object
                  additionalProperties: false
                  required: [kind, regionId]
                  description: A whole Geofabrik region; its name, country, and file come from the catalogue.
                  properties:
                    kind: { const: osm_region }
                    regionId: { type: string, pattern: '^[a-z0-9-]{1,80}$' }
                    workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
                - type: object
                  additionalProperties: false
                  required: [kind, label, bbox, categories]
                  properties:
                    kind: { const: osm_area }
                    label: { type: string, minLength: 1, maxLength: 120, description: Name of the area; it names the dataset. }
                    bbox: { type: array, minItems: 4, maxItems: 4, items: { type: number }, description: 'minLon, minLat, maxLon, maxLat; at most OSM_AREA_MAX_SQUARE_DEGREES (default 1).' }
                    countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
                    categories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OsmAreaCategory' } }
                    workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
      responses:
        '202':
          description: Job started.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/ImportJob' }
        '400': { description: Invalid request body (invalid_import_request), an area larger than allowed (area_too_large), or a region that is not in the catalogue (unknown_region)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Imports are disabled (import_disabled), or the dataset is built in (dataset_not_deletable)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: The dataset to delete does not exist or is already deleted., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: An area or region import is already running (import_kind_busy), or a running job targets the same dataset (dataset_busy)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '415': { description: The body is not application/json., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Too many running jobs in the workspace (too_many_import_jobs) or rate limit., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/imports/{id}:
    get:
      operationId: getImportJob
      summary: One import job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workspaceId, in: query, required: false, schema: { type: string, pattern: '^[\w.-]{1,120}$', default: demo } }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/ImportJob' }
        '404': { description: Unknown job or another workspace., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/imports/history/clear:
    post:
      operationId: clearImportHistory
      summary: Remove the workspace's finished jobs from the history (demo, disabled by default)
      description: Only the job history; imported data and the per-source audit rows in source_sync_runs stay. Running jobs are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
      responses:
        '200':
          description: How many jobs were removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, minimum: 0 }
        '400': { description: Invalid workspace ID., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Imports are disabled., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/imports/{id}/cancel:
    post:
      operationId: cancelImportJob
      summary: Cancel a running import job (demo, disabled by default)
      description: Cancellation takes effect between fetch windows (one day); data already fetched is not written.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                workspaceId: { type: string, pattern: '^[\w.-]{1,120}$', default: demo }
      responses:
        '200':
          description: Whether a running job was cancelled; false when it already finished.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
        '403': { description: Imports are disabled., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Unknown job or another workspace., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/datasets:
    get:
      operationId: listDatasets
      summary: Datasets with what they hold
      description: Every ready source with its place and event counts, countries, place extent, snapshot date, last successful import, and whether it can be deleted. Cached for a minute; `fresh=true` recomputes.
      parameters:
        - { name: fresh, in: query, required: false, schema: { type: string, enum: ['true'] } }
      responses:
        '200':
          description: The datasets.
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
  /api/v1/data/catalog/places:
    get:
      operationId: listCatalogPlaces
      summary: Places of a dataset or a country, page by page (data explorer)
      description: >-
        A dataset or a country is required; without a dataset, the country's datasets are read. Names that start with
        a letter come first, then by name and ID, with an opaque keyset cursor; the total is counted only for the first
        page. The search matches the name or street (an escaped LIKE); city and category are exact; bbox limits the map
        area. Each place carries the tags its card shows (opening hours, website, Wikidata, …).
      parameters:
        - { name: dataset, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' } }
        - { name: country, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: city, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - { name: category, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: bbox, in: query, required: false, description: 'minLon,minLat,maxLon,maxLat', schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 600 } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [total, places, nextCursor]
                properties:
                  total: { type: [integer, 'null'], minimum: 0, description: Null on later pages. }
                  nextCursor: { type: [string, 'null'] }
                  places:
                    type: array
                    items:
                      type: object
                      required: [id, datasetId, name, category, countryCode, city, street, houseNumber, postcode, lat, lon, details]
                      properties:
                        id: { type: string }
                        datasetId: { type: string }
                        name: { type: string }
                        category: { type: [string, 'null'] }
                        countryCode: { type: [string, 'null'] }
                        city: { type: [string, 'null'] }
                        street: { type: [string, 'null'] }
                        houseNumber: { type: [string, 'null'] }
                        postcode: { type: [string, 'null'] }
                        lat: { type: number }
                        lon: { type: number }
                        details: { type: object, additionalProperties: { type: string } }
        '400': { description: 'Invalid query or cursor, or neither a dataset nor a country (dataset_or_country_required).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Place counts per category under the explorer's other filters
      parameters:
        - { name: dataset, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' } }
        - { name: country, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: city, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: bbox, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Up to 80 categories, most places first.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [category, places]
                      properties:
                        category: { type: string }
                        places: { type: integer, minimum: 0 }
        '400': { description: Invalid query, or neither a dataset nor a country., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/datasets/{id}/events:
    get:
      operationId: listDatasetEvents
      summary: The events of one dataset, newest first, page by page
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 600 } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [total, events, nextCursor]
                properties:
                  total: { type: [integer, 'null'], minimum: 0, description: Null on later pages. }
                  nextCursor: { type: [string, 'null'] }
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, label, category, observedAt, lat, lon, magnitude]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        category: { type: string }
                        observedAt: { type: string, format: date-time }
                        lat: { type: number }
                        lon: { type: number }
                        magnitude: { type: [number, 'null'] }
        '400': { description: Invalid query or cursor., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/countries:
    get:
      operationId: listCountries
      summary: Countries with imported places
      description: Per country, the number of places, cities, towns, and villages, and the datasets that hold them (most places first). With `dataset`, the counts are that dataset's own. All countries are cached for a minute; `fresh=true` recomputes.
      parameters:
        - { name: fresh, in: query, required: false, schema: { type: string, enum: ['true'] } }
        - { name: dataset, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' } }
      responses:
        '200':
          description: The countries, most places first.
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries: { type: array, items: { $ref: '#/components/schemas/CountryCoverage' } }
  /api/v1/data/settlements:
    get:
      operationId: listSettlements
      summary: Cities, towns, and villages of one country
      description: Cities first, then towns and villages, each ordered by how many places name the settlement in their address. The search matches the local or English name.
      parameters:
        - { name: country, in: query, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: dataset, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: types, in: query, required: false, description: Comma-separated., schema: { type: string, default: 'city,town,village' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: One page of settlements and the total.
          content:
            application/json:
              schema:
                type: object
                required: [total, settlements]
                properties:
                  total: { type: integer, minimum: 0 }
                  settlements: { type: array, items: { $ref: '#/components/schemas/Settlement' } }
        '400': { description: Invalid query., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/regions:
    get:
      operationId: searchGeofabrikRegions
      summary: Browse or search the Geofabrik catalogue for a region to import whole
      description: >-
        Without `q`, the regions directly inside `parent` (Europe's countries without a parent). With `q`, regions whose
        catalogue name, ID, or parent path matches, and countries by their name in about 25 languages ("Polska",
        "Польша"). When nothing matches, the place is looked up in Nominatim (one request per second, shared with
        `/data/geocode`) and the regions that contain it are returned, by ISO 3166 code, then by its local names within
        its country, then its country; `via` names the place.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: parent, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9-]{1,80}$' } }
        - { name: language, in: query, required: false, schema: { type: string, enum: [en, ru, de], default: en } }
      responses:
        '200':
          description: Up to 12 regions for a search, or all children for browsing.
          content:
            application/json:
              schema:
                type: object
                required: [regions]
                properties:
                  regions: { type: array, items: { $ref: '#/components/schemas/GeofabrikRegion' } }
                  via: { type: string, description: The place a search found when the catalogue did not name it; the regions contain it. }
        '400': { description: Invalid query, or both q and parent., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: Too many place lookups (rate_limited)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '502': { description: The catalogue is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/regions/{id}:
    get:
      operationId: getGeofabrikRegion
      summary: A region with the size and date of its file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,80}$' } }
      responses:
        '200':
          description: The region and its file.
          content:
            application/json:
              schema:
                type: object
                required: [region, file]
                properties:
                  region: { $ref: '#/components/schemas/GeofabrikRegion' }
                  file:
                    type: object
                    required: [url, bytes, lastModified]
                    properties:
                      url: { type: string }
                      bytes: { type: [integer, 'null'] }
                      lastModified: { type: [string, 'null'], format: date-time }
        '404': { description: Not in the catalogue., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/data/geocode:
    get:
      operationId: geocodePlace
      summary: Find a settlement by name to choose an import area
      description: Proxies the OpenStreetMap Nominatim search (allowlisted host, at most one request per second, results cached for an hour).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: language, in: query, required: false, schema: { type: string, enum: [en, ru, de], default: en } }
      responses:
        '200':
          description: Up to six settlements.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/GeocodeResult' } }
        '400': { description: Invalid query., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: More than one search per second; see Retry-After., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '502': { description: Nominatim did not answer usably., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/investigations/query:
    post:
      operationId: queryInvestigationEvents
      summary: Interpret a natural-language request and run the validated event search (demo)
      description: >-
        The local model may only call the allowlisted search_events function; its arguments are validated
        and bounded, and place names are resolved to verified OpenStreetMap settlements on the server.
        The model does not write the result rows. If the model is busy, unavailable, times out, or returns
        an invalid call, a rule-based parser is used and interpretation.interpretedBy is "rules".
        Results cover the last 7 days by default and return at most 50 events per page; continue with
        GET /api/v1/investigations/events using appliedFilters and nextCursor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestigationQueryRequest' }
      responses:
        '200':
          description: Interpretation, resolved place, applied filters, and one page of matching events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationQueryResponse' }
        '400': { description: Invalid request body or malformed JSON (invalid_json)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422':
          description: The request could not be turned into a search, the place was not found, or a selection was required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationQueryError' }
        '429': { description: Too many requests; see Retry-After., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/status:
    get:
      operationId: getTrainingStatus
      summary: Whether lessons and the exam can be edited, the model, and the running exam
      responses:
        '200':
          description: Training status.
          content:
            application/json:
              schema: { type: object, required: [editEnabled, model, routerModel, installedModels, activeRunId], properties: { editEnabled: { type: boolean }, model: { type: string }, routerModel: { type: [string, 'null'] }, installedModels: { type: array, items: { type: string } }, activeRunId: { type: [string, 'null'] } } }
  /api/v1/training/model:
    get:
      operationId: getModelCard
      summary: The configured model as the local runtime describes it, with our runtime settings
      description: >-
        Read by the server from Ollama /api/show and /api/version (the browser never reaches Ollama) and cached for
        10 minutes. Only known metadata fields are returned; links are kept only on huggingface.co, github.com, and
        qwenlm.github.io.
      responses:
        '200':
          description: The model card.
          content:
            application/json:
              schema: { type: object, required: [model], properties: { model: { $ref: '#/components/schemas/ModelCard' } } }
        '503': { description: 'The runtime or the model is unavailable, model_unavailable.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/lessons:
    get:
      operationId: listLessons
      summary: All lessons (rules and approved examples)
      responses:
        '200':
          description: Lessons, rules first.
          content:
            application/json:
              schema: { type: object, required: [lessons], properties: { lessons: { type: array, items: { $ref: '#/components/schemas/Lesson' } } } }
    post:
      operationId: createLesson
      summary: Create a lesson
      description: >-
        Text that tries to override instructions, contains SQL, URLs, or code fences is refused (forbidden_text).
        An example needs a tool call, an answer, or both; its arguments are validated with that tool's own schema
        (invalid_example_args), so an example cannot teach coordinates or other fields the tool refuses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonInput' }
      responses:
        '201':
          description: The lesson.
          content:
            application/json:
              schema: { type: object, required: [lesson], properties: { lesson: { $ref: '#/components/schemas/Lesson' } } }
        '400': { description: 'invalid_lesson, forbidden_text, example_needs_tool_or_answer, or invalid_example_args, with the field.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/lessons/{id}:
    patch:
      operationId: updateLesson
      summary: Replace a lesson (a new version) or switch it on or off
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LessonInput'
                - { type: object, required: [enabled], additionalProperties: false, properties: { enabled: { type: boolean } } }
      responses:
        '200':
          description: The lesson.
          content:
            application/json:
              schema: { type: object, required: [lesson], properties: { lesson: { $ref: '#/components/schemas/Lesson' } } }
        '400': { description: 'Invalid ID or lesson.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Lesson not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      operationId: deleteLesson
      summary: Delete a lesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Lesson not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/lessons/preview:
    post:
      operationId: previewLessons
      summary: Which lessons a message would get, and the text the model would see; nothing is sent to the model
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [message], additionalProperties: false, properties: { message: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        '200':
          description: Applied lessons and the prompt block (null when none apply).
          content:
            application/json:
              schema: { type: object, required: [applied, prompt], properties: { applied: { type: array, items: { $ref: '#/components/schemas/AppliedLesson' } }, prompt: { type: [string, 'null'] } } }
  /api/v1/training/cases:
    get:
      operationId: listExamCases
      summary: Exam cases
      responses:
        '200':
          description: Cases.
          content:
            application/json:
              schema: { type: object, required: [cases], properties: { cases: { type: array, items: { $ref: '#/components/schemas/ExamCase' } } } }
    post:
      operationId: createExamCase
      summary: Add an exam case
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamCaseInput' }
      responses:
        '201':
          description: The case.
          content:
            application/json:
              schema: { type: object, required: [case], properties: { case: { $ref: '#/components/schemas/ExamCase' } } }
        '400': { description: 'invalid_case.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/cases/generate:
    post:
      operationId: generateBenchmark
      summary: Generate benchmark cases from the database and add the hand-written hard cases
      description: >-
        Replaces earlier generated cases with a new set built from templates in Russian, English, and German and real
        settlements (cities for places and trips, Central Italian towns for events), so the right tool call of each case
        is known. Hard cases (exonyms, typos, mixed languages, requests no tool serves) are added when missing. The same
        seed and data give the same set.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { perSkill: { type: integer, minimum: 5, maximum: 60, default: 20 }, seed: { type: integer, minimum: 0, maximum: 1000000, default: 1 } } }
      responses:
        '200':
          description: How many cases were generated and how many hard cases were added.
          content:
            application/json:
              schema: { type: object, required: [generated, hard], properties: { generated: { type: integer }, hard: { type: integer } } }
        '400': { description: 'invalid_request.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'An exam is running, exam_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/cases/starter:
    post:
      operationId: addStarterExamCases
      summary: Add the built-in starter exam cases that are missing; edited ones are kept
      responses:
        '200':
          description: How many were added.
          content:
            application/json:
              schema: { type: object, required: [added], properties: { added: { type: integer, minimum: 0 } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/cases/{id}:
    patch:
      operationId: updateExamCase
      summary: Replace a case or switch it on or off
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,80}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ExamCaseInput'
                - { type: object, required: [enabled], additionalProperties: false, properties: { enabled: { type: boolean } } }
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema: { type: object, required: [case], properties: { case: { $ref: '#/components/schemas/ExamCase' } } }
        '400': { description: 'Invalid ID or case.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Case not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      operationId: deleteExamCase
      summary: Delete a case; past results keep the question as it was asked
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{1,80}$' } }
      responses:
        '204': { description: Deleted. }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Case not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/runs:
    get:
      operationId: listExamRuns
      summary: The last 50 exam runs, newest first
      responses:
        '200':
          description: Runs and the running one.
          content:
            application/json:
              schema: { type: object, required: [runs, activeRunId], properties: { runs: { type: array, items: { $ref: '#/components/schemas/EvalRun' } }, activeRunId: { type: [string, 'null'] } } }
    post:
      operationId: startExamRun
      summary: Start an exam run in the background
      description: >-
        Asks every enabled case as a fresh chat turn (not stored in any conversation), with the enabled lessons or
        without any (to compare). One run at a time; the chat and the exam share the local model, so a busy model is
        waited for. Poll GET /runs/{id} for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [withLessons]
              additionalProperties: false
              properties:
                withLessons: { type: boolean }
                label: { type: string, maxLength: 120 }
                mode: { type: string, enum: [full, first_step, router], default: full, description: 'first_step stops at the model''s first tool call with the full prompt; router asks the router prompt (short, JSON answer); both check only the tool and its arguments.' }
                model: { type: string, pattern: '^[\w.:/-]{1,120}$', description: 'Another installed model to measure (unknown_model otherwise). In router mode it defaults to ROUTER_MODEL, then the main model.' }
                origins: { type: array, maxItems: 5, items: { type: string, enum: [starter, manual, generated, hard, journal] }, description: Which cases to ask; empty or missing asks every enabled case. }
      responses:
        '202':
          description: The run, before any case is asked.
          content:
            application/json:
              schema: { type: object, required: [run], properties: { run: { $ref: '#/components/schemas/EvalRun' } } }
        '400': { description: 'invalid_run.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'exam_running, or no_cases when no case is enabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/runs/{id}:
    get:
      operationId: getExamRun
      summary: One run with the result of every case so far
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run and its results.
          content:
            application/json:
              schema: { type: object, required: [run, results], properties: { run: { $ref: '#/components/schemas/EvalRun' }, results: { type: array, items: { $ref: '#/components/schemas/EvalResult' } } } }
        '400': { description: 'Invalid ID.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Run not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/runs/{id}/cancel:
    post:
      operationId: cancelExamRun
      summary: Cancel the running exam; finished cases are kept
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Cancelling. }
        '403': { description: 'Training is off (TRAINING_ENABLED; on by default only in development), training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/journal:
    get:
      operationId: listJournal
      summary: Chat turns kept on this machine, with failure signals; candidates are unreviewed turns that went wrong
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [candidates, all, confirmed], default: candidates } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 'Entries and journal statistics.'
          content:
            application/json:
              schema: { type: object, required: [total, entries, stats], properties: { total: { type: integer }, entries: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }, stats: { $ref: '#/components/schemas/JournalStats' } } }
        '400': { description: 'invalid_query.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/journal/{id}/review:
    post:
      operationId: reviewJournalEntry
      summary: Confirm the right first call of a turn (it joins the benchmark and the training data) or dismiss it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [status, tool], additionalProperties: false, properties: { status: { const: confirmed }, tool: { type: string, enum: [search_places, search_events, list_sources, plan_trip, reply] }, args: { type: object }, addToBenchmark: { type: boolean, default: true } } }
                - { type: object, required: [status], additionalProperties: false, properties: { status: { const: dismissed } } }
      responses:
        '200':
          description: 'The reviewed entry.'
          content:
            application/json:
              schema: { type: object, required: [entry], properties: { entry: { $ref: '#/components/schemas/JournalEntry' } } }
        '400': { description: 'invalid_review, or invalid_example_args when the tool would refuse the arguments.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Entry not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/journal/feedback:
    post:
      operationId: sendAnswerFeedback
      summary: Thumbs up or down for a chat answer (by its requestId); a thumbs-down marks the turn for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [requestId, rating], additionalProperties: false, properties: { requestId: { type: string, maxLength: 120 }, rating: { type: [integer, 'null'], enum: [1, -1, null] } } }
      responses:
        '204': { description: Saved. }
        '400': { description: 'invalid_feedback.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'The turn is not in the journal.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/gaps:
    get:
      operationId: getDataGaps
      summary: Settlements users asked for that are not imported, and place searches that found nothing
      responses:
        '200':
          description: 'Gaps, most frequent first.'
          content:
            application/json:
              schema: { type: object, required: [missingPlaces, emptySearches], properties: { missingPlaces: { type: array, items: { type: object, required: [name, count, lastAt], properties: { name: { type: string }, count: { type: integer }, lastAt: { type: string, format: date-time } } } }, emptySearches: { type: array, items: { type: object, required: [city, kind, count], properties: { city: { type: string }, kind: { type: [string, 'null'] }, count: { type: integer } } } } } }
  /api/v1/training/aliases:
    get:
      operationId: listSettlementAliases
      summary: Settlement aliases the server resolves without the model (Норча → Norcia)
      responses:
        '200':
          description: 'Aliases.'
          content:
            application/json:
              schema: { type: object, required: [aliases], properties: { aliases: { type: array, items: { type: object, required: [alias, placeId, name, countryCode, origin, createdAt], properties: { alias: { type: string }, placeId: { type: string }, name: { type: string }, countryCode: { type: [string, 'null'] }, origin: { type: string }, createdAt: { type: string, format: date-time } } } } } }
    post:
      operationId: addSettlementAlias
      summary: Add an alias for a settlement named exactly (local or English name)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [alias, settlement], additionalProperties: false, properties: { alias: { type: string, minLength: 2, maxLength: 120 }, settlement: { type: string, maxLength: 120 } } }
      responses:
        '201':
          description: 'The alias and its settlement.'
          content:
            application/json:
              schema: { type: object, required: [alias, settlement], properties: { alias: { type: string }, settlement: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } } }
        '400': { description: 'invalid_alias.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'settlement_not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'alias_is_a_settlement: the alias already names another settlement.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/aliases/{alias}:
    delete:
      operationId: deleteSettlementAlias
      summary: Remove an alias
      parameters:
        - { name: alias, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        '204': { description: Removed. }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'Alias not found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune:
    get:
      operationId: getFinetuneState
      summary: Router fine-tuning state, the dataset summary, and LoRA runs
      responses:
        '200':
          description: 'State.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinetuneState' }
  /api/v1/training/finetune/dataset:
    post:
      operationId: buildRouterDataset
      summary: Build the router training dataset (synthetic questions with another seed than the benchmark, accepted teacher batches, and confirmed journal turns; benchmark questions are left out)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { perSkill: { type: integer, minimum: 20, maximum: 500, default: 150 }, seed: { type: integer, minimum: 0, maximum: 1000000, default: 1000 } } }
      responses:
        '200':
          description: 'The dataset summary.'
          content:
            application/json:
              schema: { type: object, required: [dataset], properties: { dataset: { $ref: '#/components/schemas/DatasetSummary' } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'training_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune/runs:
    post:
      operationId: startLoraRun
      summary: Start LoRA fine-tuning of a small base model in a local Python process (model/training/train_router.py)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [baseModel], additionalProperties: false, properties: { baseModel: { type: string, enum: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B] }, epochs: { type: number, minimum: 0.5, maximum: 5, default: 2 }, learningRate: { type: number, minimum: 0.00001, maximum: 0.001, default: 0.0002 }, rank: { type: integer, enum: [8, 16, 32], default: 16 }, autoBenchmark: { type: boolean, default: false, description: 'Publish to Ollama and start the router benchmark once training succeeds.' } } }
      responses:
        '202':
          description: 'The run.'
          content:
            application/json:
              schema: { type: object, required: [run], properties: { run: { $ref: '#/components/schemas/LoraRun' } } }
        '400': { description: 'invalid_run.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'training_running, python_missing, or dataset_missing.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune/runs/{id}/cancel:
    post:
      operationId: cancelLoraRun
      summary: Stop a running LoRA run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d{8}-[0-9a-f]{6}$' } }
      responses:
        '202': { description: Stopping. }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune/runs/{id}/publish:
    post:
      operationId: publishLoraRun
      summary: Register a finished run in Ollama as waypoint-router:<id>, in the background (merge an imported adapter, convert to GGUF Q8_0, ollama create); the run shows the stage in publishing and the result in publishedAs or publishError
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d{8}-[0-9a-f]{6}$' } }
      responses:
        '202':
          description: 'The run, with publishing set.'
          content:
            application/json:
              schema: { type: object, required: [run], properties: { run: { $ref: '#/components/schemas/LoraRun' } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'run_not_finished, publish_running, converter_missing, or python_missing.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune/runs/{id}/export:
    get:
      operationId: exportLoraRun
      summary: Download a finished run as a package (tar with manifest.json, SHA-256 per file, the LoRA adapter, and for kind gguf the model ready for Ollama)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^\d{8}-[0-9a-f]{6}$' } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [adapter, gguf] } }
      responses:
        '200':
          description: 'The package.'
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '400': { description: 'invalid_request.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'run_not_finished or export_unavailable (no GGUF until the run is published).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/finetune/import:
    post:
      operationId: importLoraPackage
      summary: Import a package as a new run. Only regular files under fixed names are accepted; sizes, checksums, the base model, and the weight headers (safetensors, GGUF) are checked before anything is kept
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'The new run.'
          content:
            application/json:
              schema: { type: object, required: [run], properties: { run: { $ref: '#/components/schemas/LoraRun' } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'import_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '413': { description: 'too_large (over 7 GB).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '415': { description: 'unsupported_media_type.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: 'not_a_package, unexpected_entry, checksum_mismatch, unsupported_base_model, invalid_weights, or missing_file.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher:
    get:
      operationId: getTeacherState
      summary: The teacher (an OpenAI model writing router training examples), its topics, today's usage, the running batch, and the batches
      responses:
        '200':
          description: 'State.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherState' }
  /api/v1/training/teacher/batches:
    post:
      operationId: startTeacherBatch
      summary: Start a batch in the background; only synthetic instructions and settlement names are sent to OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [topic, languages, count], additionalProperties: false, properties: { topic: { type: string, enum: [exonyms, places, events, trips, chat, mixed] }, languages: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [ru, en, de] } }, count: { type: integer, minimum: 5, maximum: 200 }, crossCheck: { type: boolean, default: false, description: 'The teacher answers every passed question again blind; a different call marks the example disputed.' } } }
      responses:
        '202':
          description: 'The batch.'
          content:
            application/json:
              schema: { type: object, required: [batch], properties: { batch: { $ref: '#/components/schemas/TeacherBatch' } } }
        '400': { description: 'invalid_batch.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'teacher_running or teacher_unavailable (no OPENAI_API_KEY).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: 'daily_limit, with remaining.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher/batches/{id}:
    get:
      operationId: getTeacherBatch
      summary: A batch and its examples with the results of the checks
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'The batch.'
          content:
            application/json:
              schema: { type: object, required: [batch, examples], properties: { batch: { $ref: '#/components/schemas/TeacherBatch' }, examples: { type: array, items: { $ref: '#/components/schemas/TeacherExample' } } } }
        '404': { description: 'not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      operationId: deleteTeacherBatch
      summary: Delete a batch's examples; the batch stays hidden and still counts toward the daily limit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'batch_busy (generating or already deleted).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher/batches/{id}/cancel:
    post:
      operationId: cancelTeacherBatch
      summary: Stop a generating batch; what was written stays reviewable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Stopping. }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher/batches/{id}/regenerate:
    post:
      operationId: regenerateTeacherBatch
      summary: Replace the rejected examples with new ones, up to the requested size
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: 'The batch.'
          content:
            application/json:
              schema: { type: object, required: [batch], properties: { batch: { $ref: '#/components/schemas/TeacherBatch' } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'batch_busy, nothing_to_regenerate, or teacher_running.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429': { description: 'daily_limit.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher/batches/{id}/accept:
    post:
      operationId: acceptTeacherBatch
      summary: Accept a reviewed batch into the dataset (on its next build), or take it out again
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accepted], additionalProperties: false, properties: { accepted: { type: boolean } } }
      responses:
        '200':
          description: 'The batch.'
          content:
            application/json:
              schema: { type: object, required: [batch], properties: { batch: { $ref: '#/components/schemas/TeacherBatch' } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'batch_busy.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/v1/training/teacher/examples/{id}:
    patch:
      operationId: editTeacherExample
      summary: Edit an example (the checks run again; a passing edit counts as approved by a person) or approve a disputed one as it is
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { question: { type: string, minLength: 3, maxLength: 400 }, language: { type: string, enum: [ru, en, de] }, tool: { type: string, enum: [search_places, search_events, plan_trip, list_sources, reply] }, args: { type: object }, approve: { type: boolean } } }
      responses:
        '200':
          description: 'The example.'
          content:
            application/json:
              schema: { type: object, required: [example], properties: { example: { $ref: '#/components/schemas/TeacherExample' } } }
        '400': { description: 'invalid_example.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: 'batch_busy or not_disputed.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      operationId: deleteTeacherExample
      summary: Delete an example
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '403': { description: 'Training is off, training_disabled.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: 'not_found.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
components:
  schemas:
    JournalEntry:
      type: object
      required: [id, requestId, conversationId, language, message, model, toolCalls, firstTool, outcome, errorCode, signals, feedback, durationMs, reviewStatus, corrected, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        conversationId: { type: string }
        language: { type: [string, 'null'] }
        message: { type: string }
        model: { type: string }
        toolCalls: { type: array, items: { type: object, required: [tool, args], properties: { tool: { type: string }, args: {}, error: { type: [string, 'null'] }, resultCount: { type: [integer, 'null'] } } } }
        firstTool: { type: [string, 'null'] }
        outcome: { type: string, enum: [completed, clarification, error, cancelled] }
        errorCode: { type: [string, 'null'] }
        signals: { type: object, properties: { emptyResult: { type: boolean }, placeNotFound: { type: [string, 'null'] }, invalidArgs: { type: boolean }, retriedWithoutTool: { type: boolean }, rephrased: { type: boolean } } }
        feedback: { type: [integer, 'null'], enum: [1, -1, null] }
        durationMs: { type: integer }
        reviewStatus: { type: string, enum: [new, confirmed, dismissed] }
        corrected: { type: [object, 'null'], properties: { tool: { type: string }, args: { type: object } } }
        createdAt: { type: string, format: date-time }
    JournalStats:
      type: object
      required: [total, candidates, confirmed, thumbsUp, thumbsDown, failureShareWeek]
      properties:
        total: { type: integer }
        candidates: { type: integer }
        confirmed: { type: integer }
        thumbsUp: { type: integer }
        thumbsDown: { type: integer }
        failureShareWeek: { type: [number, 'null'] }
    DatasetSummary:
      type: object
      required: [total, bySkill, byLanguage, bySource, excludedAsBenchmark, createdAt, path]
      properties:
        total: { type: integer }
        bySkill: { type: object, additionalProperties: { type: integer } }
        byLanguage: { type: object, additionalProperties: { type: integer } }
        bySource: { type: object, additionalProperties: { type: integer } }
        byTopic: { type: object, additionalProperties: { type: integer }, description: Teacher examples per topic. }
        excludedAsBenchmark: { type: integer }
        createdAt: { type: string, format: date-time }
        path: { type: string }
    LoraRun:
      type: object
      required: [id, status, phase, baseModel, epochs, learningRate, rank, examples, device, step, totalSteps, epoch, etaSeconds, peakMemoryMb, losses, timeline, error, startedAt, finishedAt, autoBenchmark, publishedAs, publishing, publishError, benchmarkRunId, benchmarkError, imported, exports]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        phase: { type: string }
        baseModel: { type: string }
        epochs: { type: number }
        learningRate: { type: number }
        rank: { type: integer }
        examples: { type: [integer, 'null'] }
        device: { type: [string, 'null'] }
        step: { type: integer }
        totalSteps: { type: [integer, 'null'] }
        epoch: { type: [number, 'null'], description: 'Epochs done so far, fractional.' }
        etaSeconds: { type: [number, 'null'] }
        peakMemoryMb: { type: [integer, 'null'] }
        timeline: { type: array, description: 'When each stage began: starting, loading, tokenized, training, saving, done, merging, converting, creating, published, benchmark, or imported.', items: { type: object, required: [phase, at], properties: { phase: { type: string }, at: { type: string, format: date-time } } } }
        losses: { type: array, items: { type: object, required: [step, loss, validationLoss], properties: { step: { type: integer }, loss: { type: [number, 'null'] }, validationLoss: { type: [number, 'null'] } } } }
        error: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        autoBenchmark: { type: boolean }
        publishedAs: { type: [string, 'null'] }
        publishing: { type: [string, 'null'], enum: [merging, converting, creating, null] }
        publishError: { type: [string, 'null'] }
        benchmarkRunId: { type: [string, 'null'] }
        benchmarkError: { type: [string, 'null'] }
        imported: { type: [object, 'null'], required: [fromRunId, kind, at], properties: { fromRunId: { type: string }, kind: { type: string, enum: [adapter, gguf] }, at: { type: string, format: date-time } } }
        exports: { type: object, required: [adapter, gguf], properties: { adapter: { type: boolean }, gguf: { type: boolean } } }
    TeacherState:
      type: object
      required: [available, model, topics, languages, usage, progress, batches]
      properties:
        available: { type: boolean, description: OPENAI_API_KEY is set. }
        model: { type: string }
        topics: { type: array, items: { type: object, required: [id, title, description, tools], properties: { id: { type: string }, title: { type: object, additionalProperties: { type: string } }, description: { type: object, additionalProperties: { type: string } }, tools: { type: array, items: { type: string } } } } }
        languages: { type: array, items: { type: string, enum: [ru, en, de] } }
        usage: { type: object, required: [generatedToday, dailyLimit], properties: { generatedToday: { type: integer }, dailyLimit: { type: integer } } }
        progress: { type: [object, 'null'], required: [batchId, done, total], properties: { batchId: { type: string, format: uuid }, done: { type: integer }, total: { type: integer } } }
        batches: { type: array, items: { $ref: '#/components/schemas/TeacherBatch' } }
    TeacherBatch:
      type: object
      required: [id, topic, languages, requested, model, crossCheck, status, errorCode, promptTokens, completionTokens, counts, createdAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        topic: { type: string }
        languages: { type: array, items: { type: string, enum: [ru, en, de] } }
        requested: { type: integer }
        model: { type: string }
        crossCheck: { type: boolean }
        status: { type: string, enum: [generating, review, accepted, failed, cancelled] }
        errorCode: { type: [string, 'null'] }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        counts: { type: object, required: [passed, disputed, rejected, edited], properties: { passed: { type: integer }, disputed: { type: integer }, rejected: { type: integer }, edited: { type: integer } } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    TeacherExample:
      type: object
      required: [id, batchId, question, language, tool, args, status, reasons]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        question: { type: string }
        language: { type: string, enum: [ru, en, de] }
        tool: { type: string }
        args: { type: object }
        status: { type: string, enum: [passed, disputed, rejected, edited] }
        reasons: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [invalid_call, question_length, language_mismatch, off_topic, not_earthquakes, city_unknown, duplicate, benchmark_leak, city_corrected, cross_check_mismatch] }, detail: { type: string } } } }
    FinetuneState:
      type: object
      required: [availability, baseModels, dataset, runs, activeRunId]
      properties:
        availability: { type: object, required: [python, dataset, converter], properties: { python: { type: boolean }, dataset: { type: boolean }, converter: { type: boolean, description: llama.cpp's GGUF converter, needed to publish. } } }
        baseModels: { type: array, items: { type: string } }
        dataset:
          oneOf:
            - $ref: '#/components/schemas/DatasetSummary'
            - type: 'null'
        runs: { type: array, items: { $ref: '#/components/schemas/LoraRun' } }
        activeRunId: { type: [string, 'null'] }
    ModelCard:
      type: object
      required: [name, family, version, finetune, parameterCount, parameterSize, format, quantization, architecture, contextLength, license, licenseUrl, modelUrl, capabilities, installedAt, runtimeVersion, settings]
      properties:
        name: { type: string }
        family: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        finetune: { type: [string, 'null'], description: 'The developer''s fine-tune of the base model, for example Instruct.' }
        parameterCount: { type: [number, 'null'] }
        parameterSize: { type: [string, 'null'] }
        format: { type: [string, 'null'] }
        quantization: { type: [string, 'null'] }
        architecture:
          type: object
          required: [layers, attentionHeads, keyValueHeads, embeddingLength, feedForwardLength]
          properties:
            layers: { type: [number, 'null'] }
            attentionHeads: { type: [number, 'null'] }
            keyValueHeads: { type: [number, 'null'] }
            embeddingLength: { type: [number, 'null'] }
            feedForwardLength: { type: [number, 'null'] }
        contextLength: { type: [number, 'null'], description: The model's maximum context; settings.contextLength is what the app uses. }
        license: { type: [string, 'null'] }
        licenseUrl: { type: [string, 'null'], format: uri }
        modelUrl: { type: [string, 'null'], format: uri }
        capabilities: { type: array, items: { type: string } }
        installedAt: { type: [string, 'null'], format: date-time }
        runtimeVersion: { type: [string, 'null'] }
        settings:
          type: object
          required: [contextLength, maxAnswerTokens, temperature, keepAlive]
          properties:
            contextLength: { type: integer }
            maxAnswerTokens: { type: integer }
            temperature: { type: number }
            keepAlive: { type: string }
    LessonInput:
      oneOf:
        - type: object
          required: [kind, topic, title, text]
          additionalProperties: false
          properties:
            kind: { const: rule }
            topic: { $ref: '#/components/schemas/LessonTopic' }
            title: { type: string, minLength: 1, maxLength: 120 }
            text: { type: string, minLength: 1, maxLength: 300 }
            enabled: { type: boolean }
        - type: object
          required: [kind, topic, title, text]
          additionalProperties: false
          properties:
            kind: { const: example }
            topic: { $ref: '#/components/schemas/LessonTopic' }
            title: { type: string, minLength: 1, maxLength: 120 }
            text: { type: string, minLength: 1, maxLength: 300, description: The user's question. }
            exampleTool: { type: [string, 'null'], enum: [search_places, search_events, list_sources, plan_trip, reply, null] }
            exampleArgs: { type: [object, 'null'], additionalProperties: true }
            exampleAnswer: { type: [string, 'null'], maxLength: 600 }
            enabled: { type: boolean }
    LessonTopic: { type: string, enum: [all, places, events, trips, sources] }
    Lesson:
      type: object
      required: [id, kind, topic, title, text, exampleTool, exampleArgs, exampleAnswer, enabled, version, appliedCount, lastAppliedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [rule, example] }
        topic: { $ref: '#/components/schemas/LessonTopic' }
        title: { type: string }
        text: { type: string }
        exampleTool: { type: [string, 'null'], enum: [search_places, search_events, list_sources, plan_trip, reply, null] }
        exampleArgs: { type: [object, 'null'], additionalProperties: true }
        exampleAnswer: { type: [string, 'null'] }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        appliedCount: { type: integer, minimum: 0, description: How many chat turns this lesson reached. }
        lastAppliedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppliedLesson:
      type: object
      required: [id, kind, title, score]
      properties:
        id: { type: string }
        kind: { type: string, enum: [rule, example] }
        title: { type: string }
        score: { type: number, minimum: 0, maximum: 1, description: Similarity of an example to the message; 1 for rules. }
    CaseExpectation:
      type: object
      additionalProperties: false
      description: Each field present becomes one check; the answer's language is always checked.
      properties:
        tool: { type: string, enum: [search_places, search_events, list_sources, plan_trip, reply, search_records, get_record_details, edit_trip_plan] }
        args:
          type: object
          maxProperties: 8
          propertyNames: { pattern: '^[A-Za-z][\w.]{0,39}$' }
          additionalProperties:
            oneOf:
              - { type: [string, number, boolean] }
              - { type: array, minItems: 1, maxItems: 5, items: { type: string } }
          description: 'Arguments the call must contain. Strings compare case-insensitively; a list accepts any of its values (a city by its local or English name); a dotted key reaches into nested values (cities.0.name).'
        mustInclude: { type: array, maxItems: 5, items: { type: string, maxLength: 80 } }
        mustNotInclude: { type: array, maxItems: 5, items: { type: string, maxLength: 80 } }
        citations: { type: boolean, description: 'The answer must cite rows ([E1], [P1]).' }
        citeEachEvent: { type: boolean, description: 'Every sentence that states a magnitude must cite its event ([E1]); a summary of a magnitude range does not count.' }
        maxSentences: { type: integer, minimum: 1, maximum: 20 }
    ExamCaseInput:
      type: object
      required: [question, language, expect]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 300 }
        language: { type: string, enum: [ru, en, de] }
        expect: { $ref: '#/components/schemas/CaseExpectation' }
        enabled: { type: boolean }
    ExamCase:
      type: object
      required: [id, question, language, expect, enabled, skill, origin]
      properties:
        id: { type: string }
        question: { type: string }
        language: { type: string, enum: [ru, en, de] }
        expect: { $ref: '#/components/schemas/CaseExpectation' }
        enabled: { type: boolean }
        skill: { type: string, enum: [places, events, trips, sources, reply, other] }
        origin: { type: string, enum: [starter, manual, generated, hard, journal] }
    EvalRun:
      type: object
      required: [id, status, mode, caseOrigins, metrics, withLessons, lessonIds, model, label, caseCount, casesDone, casesPassed, checksTotal, checksPassed, score, errorCode, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        mode: { type: string, enum: [full, first_step, router] }
        caseOrigins: { type: array, items: { type: string } }
        metrics:
          oneOf:
            - $ref: '#/components/schemas/RunMetrics'
            - type: 'null'
        withLessons: { type: boolean }
        lessonIds: { type: array, items: { type: string }, description: Lessons enabled when the run started. }
        model: { type: string }
        label: { type: [string, 'null'] }
        caseCount: { type: integer }
        casesDone: { type: integer }
        casesPassed: { type: integer }
        checksTotal: { type: integer }
        checksPassed: { type: integer }
        score: { type: [number, 'null'], minimum: 0, maximum: 1, description: Share of passed checks. }
        errorCode: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    Share:
      type: object
      required: [passed, total, low, high]
      description: A share of passed cases with its 95% Wilson interval.
      properties:
        passed: { type: integer }
        total: { type: integer }
        low: { type: number }
        high: { type: number }
    RunMetrics:
      type: object
      required: [overall, bySkill, byLanguage, tool, args]
      properties:
        overall: { $ref: '#/components/schemas/Share' }
        bySkill: { type: object, additionalProperties: { $ref: '#/components/schemas/Share' } }
        byLanguage: { type: object, additionalProperties: { $ref: '#/components/schemas/Share' } }
        tool: { $ref: '#/components/schemas/Share' }
        args: { $ref: '#/components/schemas/Share' }
    EvalCheck:
      type: object
      required: [check, passed]
      properties:
        check: { type: string, enum: [completed, tool, args, language, mustInclude, mustNotInclude, citations, citeEachEvent, maxSentences] }
        passed: { type: boolean }
        expected: {}
        actual: {}
    EvalResult:
      type: object
      required: [caseId, question, skill, language, passed, checks, toolCalls, answer, appliedLessons, durationMs, errorCode]
      properties:
        caseId: { type: string }
        question: { type: string }
        skill: { type: string }
        language: { type: [string, 'null'] }
        passed: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/EvalCheck' } }
        toolCalls: { type: array, items: { type: object, required: [tool, args], properties: { tool: { type: string }, args: {} } } }
        answer: { type: string }
        appliedLessons: { type: array, items: { $ref: '#/components/schemas/AppliedLesson' } }
        durationMs: { type: integer, minimum: 0 }
        errorCode: { type: [string, 'null'] }
    HealthResponse:
      type: object
      required: [status, apiVersion]
      properties:
        status:
          type: string
          const: ok
        apiVersion:
          type: string
          const: v1
    CapabilitiesResponse:
      type: object
      required: [assistantStatus, transport, supportedFilters, demoMode]
      properties:
        assistantStatus:
          type: string
          enum: [ready, model_unavailable, data_unavailable, starting]
        transport:
          type: string
          const: websocket
        websocketPath:
          type: string
          const: /api/v1/assistant/ws
        modelLabel:
          type: [string, 'null']
          description: Safe display name only; never return local paths or settings.
        supportedFilters:
          type: array
          items:
            type: string
          examples: [[dateRange, sourceIds, polygonIds, category]]
        demoMode:
          type: boolean
        voiceInput:
          type: boolean
          description: >-
            Demo, opt-in. True when the backend is configured to relay microphone audio
            to the external OpenAI Realtime transcription service over the assistant WebSocket.
    DataSource:
      type: object
      required: [id, label, mode, status]
      properties:
        id:
          type: string
        label:
          type: string
        mode:
          type: string
          enum: [synthetic_local, public_snapshot, approved_live, client_api]
        status:
          type: string
          enum: [ready, unavailable]
        attribution:
          type: [string, 'null']
        snapshotDate:
          type: [string, 'null']
          format: date
        sourceUrl:
          type: [string, 'null']
          format: uri
        license:
          type: [string, 'null']
        lastSync:
          description: Latest import run for sources fed by the event pipeline; null for snapshot sources.
          oneOf:
            - $ref: '#/components/schemas/SyncSummary'
            - type: 'null'
    Place:
      type: object
      required: [id, sourceId, name, lat, lon, category, countryCode, city, street, houseNumber, postcode]
      properties:
        id: { type: string }
        sourceId: { type: string }
        name: { type: string }
        category: { type: [string, 'null'] }
        countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        city: { type: [string, 'null'] }
        street: { type: [string, 'null'] }
        houseNumber: { type: [string, 'null'] }
        postcode: { type: [string, 'null'] }
        details:
          type: object
          additionalProperties: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    RouteRequest:
      type: object
      additionalProperties: false
      required: [points]
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [lat, lon]
            properties:
              lat: { type: number, minimum: -90, maximum: 90 }
              lon: { type: number, minimum: -180, maximum: 180 }
    RoutePlan:
      type: object
      required: [distanceMeters, durationSeconds, order, geometry]
      properties:
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        order:
          type: array
          items: { type: integer, minimum: 0, maximum: 7 }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { const: LineString }
            coordinates:
              type: array
              items:
                type: array
                prefixItems:
                  - { type: number, minimum: -180, maximum: 180 }
                  - { type: number, minimum: -90, maximum: 90 }
                minItems: 2
                maxItems: 2
    OsmAreaCategory:
      type: string
      enum: [attraction, museum, gallery, viewpoint, monument, castle, church, theatre, park, restaurant, cafe, bar, hotel, transport]
    Dataset:
      type: object
      required: [id, label, kind, mode, license, attribution, sourceUrl, snapshotDate, places, events, bbox, countries, lastImportAt, deletable, matchedEvents]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [places, events] }
        mode: { type: string }
        license: { type: [string, 'null'] }
        attribution: { type: [string, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        snapshotDate: { type: [string, 'null'], format: date }
        places: { type: integer, minimum: 0 }
        events: { type: integer, minimum: 0 }
        bbox: { type: [array, 'null'], minItems: 4, maxItems: 4, items: { type: number }, description: Extent of the places. }
        countries: { type: array, items: { type: string }, description: Country codes of the places, most places first. }
        lastImportAt: { type: [string, 'null'], format: date-time }
        deletable: { type: boolean, description: Only datasets imported from the app can be deleted. }
        matchedEvents: { type: integer, minimum: 0, description: Events that another catalogue also reports (cross-check). }
    CountryCoverage:
      type: object
      required: [countryCode, places, cities, towns, villages, datasets]
      properties:
        countryCode: { type: string }
        places: { type: integer, minimum: 0 }
        cities: { type: integer, minimum: 0 }
        towns: { type: integer, minimum: 0 }
        villages: { type: integer, minimum: 0 }
        datasets: { type: array, items: { type: string } }
    Settlement:
      type: object
      required: [id, name, nameEn, type, countryCode, datasetId, lat, lon, places]
      properties:
        id: { type: string }
        name: { type: string }
        nameEn: { type: [string, 'null'], description: English name when it differs. }
        type: { type: string, enum: [city, town, village] }
        countryCode: { type: [string, 'null'] }
        datasetId: { type: string }
        lat: { type: number }
        lon: { type: number }
        places: { type: integer, minimum: 0, description: Places whose address names this settlement. }
    GeofabrikRegion:
      type: object
      required: [id, name, path, countryCode, pbfUrl, parentId, hasChildren, isoCodes]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: array, items: { type: string }, description: Parent regions, outermost first. }
        countryCode: { type: [string, 'null'] }
        pbfUrl: { type: string }
        parentId: { type: [string, 'null'] }
        hasChildren: { type: boolean }
        isoCodes: { type: array, items: { type: string }, description: ISO 3166 codes the catalogue gives the region itself. }
    GeocodeResult:
      type: object
      required: [label, name, localizedName, type, countryCode, lat, lon, bbox]
      properties:
        label: { type: string }
        name: { type: string, description: Local name as stored in OpenStreetMap; names the dataset. }
        localizedName: { type: string, description: Name in the requested language. }
        type: { type: string }
        countryCode: { type: [string, 'null'] }
        lat: { type: number }
        lon: { type: number }
        bbox: { type: array, minItems: 4, maxItems: 4, items: { type: number }, description: 'minLon, minLat, maxLon, maxLat' }
    ImportJobSource:
      type: object
      required: [sourceId, label, status, progress, phase, windowStart, stepsDone, stepsTotal, fetched, inserted, updated, linkedPlaces, runId, errorCode, retryAfterSeconds]
      properties:
        sourceId: { type: string }
        label: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 1 }
        phase: { type: [string, 'null'], enum: [fetching, saving, linking, done, null] }
        windowStart: { type: [string, 'null'], format: date-time, description: Start of the day being fetched. }
        stepsDone: { type: integer, minimum: 0, description: Fetch steps done (days for events, map tiles for an area). }
        stepsTotal: { type: integer, minimum: 0 }
        fetched: { type: integer, minimum: 0 }
        inserted: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        linkedPlaces: { type: integer, minimum: 0 }
        runId: { type: [string, 'null'], description: The source's audit row in source_sync_runs; null for a deletion. }
        errorCode: { type: [string, 'null'] }
        retryAfterSeconds: { type: [integer, 'null'] }
    ImportJob:
      type: object
      required: [id, workspaceId, status, params, progress, sources, createdAt, updatedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string }
        status: { type: string, enum: [running, succeeded, partial, failed, cancelled] }
        params:
          oneOf:
            - type: object
              required: [kind, sourceIds, days]
              properties:
                kind: { const: events }
                sourceIds: { type: array, items: { type: string } }
                days: { type: integer, minimum: 1, maximum: 30 }
            - type: object
              required: [kind, datasetId, label]
              properties:
                kind: { const: dataset_delete }
                datasetId: { type: string }
                label: { type: string }
            - type: object
              required: [kind, regionId, label, countryCode]
              properties:
                kind: { const: osm_region }
                regionId: { type: string }
                label: { type: string }
                countryCode: { type: [string, 'null'] }
            - type: object
              required: [kind, label, bbox, countryCode, categories]
              properties:
                kind: { const: osm_area }
                label: { type: string }
                bbox: { type: array, minItems: 4, maxItems: 4, items: { type: number } }
                countryCode: { type: [string, 'null'] }
                categories: { type: array, items: { $ref: '#/components/schemas/OsmAreaCategory' } }
        progress: { type: number, minimum: 0, maximum: 1, description: Mean of the sources' progress. }
        sources: { type: array, items: { $ref: '#/components/schemas/ImportJobSource' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SyncSummary:
      type: object
      required: [status, startedAt, finishedAt, fetchedCount, insertedCount, updatedCount, skippedCount, errorCode, lastSucceededAt]
      properties:
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        fetchedCount: { type: integer, minimum: 0 }
        insertedCount: { type: integer, minimum: 0 }
        updatedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        errorCode:
          type: [string, 'null']
          description: Stable code such as upstream_unavailable, upstream_timeout, upstream_malformed, stale_run, or window_truncated.
        lastSucceededAt: { type: [string, 'null'], format: date-time }
    InvestigationEvent:
      type: object
      required: [id, sourceId, observedAt, label, lat, lon, accuracyMeters, attributes]
      properties:
        id: { type: string, description: '"<sourceId>:<externalId>"' }
        sourceId: { type: string }
        observedAt: { type: string, format: date-time }
        label: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: [number, 'null'] }
        distanceMeters:
          type: integer
          minimum: 0
          description: Straight-line distance from the search center; present only for radius searches.
        attributes:
          type: object
          description: Source-specific fields. Seismic events include category, magnitude, magnitudeType, depthKm, placeDescription, author, and sourceEventUrl.
          additionalProperties: true
        crossCheck:
          $ref: '#/components/schemas/CrossCheckSummary'
          description: Present in search results.
    CrossCheckSummary:
      type: object
      description: >-
        How the event compares with other live catalogues (INGV, USGS). Matches are computed at import: another
        catalogue's event within 30 s and 50 km. confirmed = reported elsewhere and magnitude (within 0.5) and depth
        (within 10 km or 10%) agree; conflict = reported elsewhere but they differ; single = another catalogue was
        imported for that time but does not report it (USGS rarely lists events below about M2.5 in Europe);
        unchecked = no other catalogue covers that time, or the event is synthetic.
      required: [status, matchedSourceIds, checkedSourceIds]
      properties:
        status: { type: string, enum: [confirmed, conflict, single, unchecked] }
        matchedSourceIds: { type: array, items: { type: string } }
        checkedSourceIds: { type: array, items: { type: string }, description: Other live sources whose successful imports cover the event's time. }
    CrossCheckMatch:
      type: object
      required: [event, timeDeltaMs, distanceMeters, magnitudeDelta, depthDeltaKm, consistent]
      properties:
        event: { $ref: '#/components/schemas/InvestigationEvent' }
        timeDeltaMs: { type: integer, minimum: 0 }
        distanceMeters: { type: integer, minimum: 0 }
        magnitudeDelta: { type: [number, 'null'], minimum: 0 }
        depthDeltaKm: { type: [number, 'null'], minimum: 0 }
        consistent: { type: boolean }
    AppliedEventFilters:
      type: object
      required: [from, to, limit]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        near:
          type: object
          required: [lat, lon, radiusKm]
          properties:
            lat: { type: number }
            lon: { type: number }
            radiusKm: { type: number }
        minMagnitude: { type: number }
        maxMagnitude: { type: number }
        sourceIds: { type: array, items: { type: string } }
        category: { type: string }
        crossCheck: { type: string, enum: [confirmed, conflict] }
        merge: { type: boolean }
        limit: { type: integer }
    EventSearchResponse:
      type: object
      required: [total, events, nextCursor, appliedFilters, mapFeatures, sources]
      properties:
        total: { type: integer, minimum: 0, description: Matches for the filters across all pages. }
        magnitudeRange:
          type: [object, 'null']
          description: Smallest and largest magnitude over every match, not only this page; null when no match has one.
          required: [min, max]
          properties:
            min: { type: number }
            max: { type: number }
        events:
          type: array
          items: { $ref: '#/components/schemas/InvestigationEvent' }
        nextCursor: { type: [string, 'null'] }
        appliedFilters: { $ref: '#/components/schemas/AppliedEventFilters' }
        mapFeatures:
          type: object
          required: [type, features]
          properties:
            type: { const: FeatureCollection }
            features: { type: array, items: { type: object } }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DataSource' }
    LinkedPlace:
      type: object
      required: [relation, distanceMeters, place]
      properties:
        relation: { type: string, const: nearby }
        distanceMeters: { type: integer, minimum: 0, description: Straight-line distance computed at import time. }
        place: { $ref: '#/components/schemas/Place' }
    EventDetailsResponse:
      type: object
      required: [event, linkedPlaces, sources, lastSync, crossCheck]
      properties:
        event: { $ref: '#/components/schemas/InvestigationEvent' }
        crossCheck:
          allOf:
            - $ref: '#/components/schemas/CrossCheckSummary'
            - type: object
              required: [matches]
              properties:
                matches: { type: array, items: { $ref: '#/components/schemas/CrossCheckMatch' } }
        linkedPlaces:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LinkedPlace' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DataSource' }
        lastSync:
          oneOf:
            - $ref: '#/components/schemas/SyncSummary'
            - type: 'null'
    LinkedEvent:
      type: object
      required: [relation, distanceMeters, event]
      properties:
        relation: { type: string, const: nearby }
        distanceMeters: { type: integer, minimum: 0 }
        event: { $ref: '#/components/schemas/InvestigationEvent' }
    EntityDetailsResponse:
      type: object
      required: [place, linkedEvents, totalLinkedEvents, sources]
      properties:
        place: { $ref: '#/components/schemas/Place' }
        linkedEvents:
          type: array
          items: { $ref: '#/components/schemas/LinkedEvent' }
        totalLinkedEvents: { type: integer, minimum: 0 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DataSource' }
    InvestigationQueryRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 300 }
        language: { type: string, enum: [en, ru, de], default: en }
        selection:
          description: The currently selected map event, used for "here" or "this location".
          oneOf:
            - type: object
              additionalProperties: false
              required: [lat, lon, label]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
                label: { type: string, maxLength: 200 }
            - type: 'null'
    SearchEventsArguments:
      type: object
      additionalProperties: false
      description: Validated arguments of the search_events tool.
      properties:
        place: { type: string, maxLength: 100 }
        nearSelection: { type: boolean }
        radiusKm: { type: number, exclusiveMinimum: 0, maximum: 300 }
        hours: { type: integer, minimum: 1, maximum: 2160 }
        minMagnitude: { type: number, minimum: -3, maximum: 11 }
        maxMagnitude: { type: number, minimum: -3, maximum: 11 }
    QueryInterpretation:
      type: object
      required: [interpretedBy, tool, arguments]
      properties:
        interpretedBy: { type: string, enum: [model, rules] }
        tool: { type: string, const: search_events }
        arguments: { $ref: '#/components/schemas/SearchEventsArguments' }
        fallbackReason:
          type: string
          enum: [model_busy, model_unavailable, model_timeout, model_no_tool_call, model_rejected_tool, model_invalid_arguments, model_error]
        rejectedTools:
          type: array
          description: Tool names the model requested that are not allowlisted; they were not executed.
          items: { type: string }
        ignoredPlace:
          type: string
          description: A country or region the model passed as place. It is not a settlement, so no radius was applied.
    ResolvedPlace:
      type: object
      required: [match, id, sourceId, name, category, countryCode, lat, lon]
      properties:
        match:
          type: string
          enum: [exact, approximate]
          description: approximate means no exact name matched and a city or town with a close spelling (same first three letters, edit distance ≤ 2) was used.
        id: { type: string }
        sourceId: { type: string }
        name: { type: string }
        category: { type: string }
        countryCode: { type: [string, 'null'] }
        lat: { type: number }
        lon: { type: number }
    InvestigationQueryResponse:
      allOf:
        - $ref: '#/components/schemas/EventSearchResponse'
        - type: object
          required: [interpretation, resolvedPlace]
          properties:
            interpretation: { $ref: '#/components/schemas/QueryInterpretation' }
            resolvedPlace:
              oneOf:
                - $ref: '#/components/schemas/ResolvedPlace'
                - type: 'null'
    InvestigationQueryError:
      type: object
      required: [error, interpretation]
      properties:
        error: { type: string, enum: [query_not_understood, place_not_found, selection_required] }
        interpretation:
          oneOf:
            - $ref: '#/components/schemas/QueryInterpretation'
            - type: 'null'
        fallbackReason:
          type: string
          enum: [model_busy, model_unavailable, model_timeout, model_no_tool_call, model_rejected_tool, model_invalid_arguments, model_error]
